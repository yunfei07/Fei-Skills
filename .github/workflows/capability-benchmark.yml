name: Fei-Skills Capability Benchmark

on:
  pull_request:
    paths:
      - 'benchmarks/transformer-explainer/**'
      - 'benchmarks/infographic-director/**'
      - 'skills/web/fei-knowledge-explainer-web/**'
      - 'skills/video/fei-knowledge-explainer-video/**'
      - 'skills/image/fei-infographic-director/**'
      - 'shared/scene-graph/**'
      - '.github/workflows/capability-benchmark.yml'
  workflow_dispatch:

jobs:
  transformer-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate benchmark scene graph
        run: python3 shared/scene-graph/validate_scene.py benchmarks/transformer-explainer/scene-graph.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Web benchmark
        working-directory: skills/web/fei-knowledge-explainer-web/runtime
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/fei-web.log 2>&1 &
          sleep 3
          npm run benchmark:capture
      - name: Build and render Video benchmark
        working-directory: skills/video/fei-knowledge-explainer-video/runtime
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx remotion browser ensure
          npm run benchmark:render
          npm run benchmark:stills
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: transformer-capability-benchmark
          if-no-files-found: error
          path: |
            skills/web/fei-knowledge-explainer-web/runtime/out/transformer-web-*.png
            skills/video/fei-knowledge-explainer-video/runtime/out/transformer-benchmark.mp4
            skills/video/fei-knowledge-explainer-video/runtime/out/transformer-video-*.png
          retention-days: 14

  infographic-director-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install infographic validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate render-brief template
        run: python3 skills/image/fei-infographic-director/scripts/validate_render_brief.py skills/image/fei-infographic-director/templates/render-brief.example.json
      - name: Validate infographic benchmark contracts
        run: |
          for brief in benchmarks/infographic-director/*.json; do
            python3 skills/image/fei-infographic-director/scripts/validate_render_brief.py "$brief"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic infographic renderer
        working-directory: skills/image/fei-infographic-director/runtime
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test visual grammar intelligence planner
        working-directory: skills/image/fei-infographic-director/runtime
        run: npm run benchmark:planner
      - name: Render automatic planning benchmarks
        working-directory: skills/image/fei-infographic-director/runtime
        run: npm run benchmark:auto
      - name: Render and inspect infographic benchmarks
        working-directory: skills/image/fei-infographic-director/runtime
        run: npm run benchmark
      - name: Upload infographic benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infographic-director-benchmark
          if-no-files-found: error
          path: |
            skills/image/fei-infographic-director/runtime/out/*.png
            skills/image/fei-infographic-director/runtime/out/auto/*.png
            skills/image/fei-infographic-director/runtime/out/*report.json
          retention-days: 14
